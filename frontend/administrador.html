<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración - Pesca Deportiva</title>
    <link rel="stylesheet" href="pagina.css" />
    <link rel="stylesheet" href="administrador.css" />
    <link rel="stylesheet" href="elementos_adicionales.css" />
  </head>
  <body>
    <div class="cabecera">
      <div class="cabecera-contenido">
        <div class="cabecera-logo">
          <img
            src="images/logo-pesca.png"
            alt="Logo Pesca Deportiva"
            class="logo-img"
          />
        </div>
        <div class="cabecera-texto">
          <h1>⚙️ Panel de Administración</h1>
          <p>Gestión de usuarios y contenido</p>
        </div>
        <div class="cabecera-usuario" id="headerUserInfo">
          <span id="headerUserName"></span>
          <button class="btn-logout-header" id="headerLogoutBtn">
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>

    <!-- Menú hamburguesa (visible en móvil) -->
    <div class="menu-mobile">
      <button
        class="menu-hamburguesa"
        id="menuHamburguesaBtn"
        aria-label="Menú de administración"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="menu-mobile-titulo">⚙️ Admin</div>
      <button class="btn-volver-mobile" id="btnVolverMobile">🏠</button>
    </div>

    <!-- Menú desplegable móvil -->
    <div class="menu-desplegable" id="menuAdminDesplegable">
      <button class="admin-btn-mobile" data-panel="pescadores">
        🎣 Pescadores
      </button>
      <button class="admin-btn-mobile" data-panel="clubs">🏢 Clubs</button>
      <button class="admin-btn-mobile" data-panel="administradores">
        👤 Administradores
      </button>
      <button class="admin-btn-mobile" data-panel="jornadas">
        📅 Jornadas
      </button>
      <button class="admin-btn-mobile" data-panel="concursos">
        🏆 Concursos
      </button>
      <button class="admin-btn-mobile" data-panel="especies">
        🐟 Especies
      </button>
    </div>

    <!-- Menú tradicional (visible en desktop) -->
    <div class="menu" id="menuDesktop">
      <button id="btnVolver">🏠 Volver al inicio</button>
    </div>

    <div class="contenedor-principal">
      <!-- Columna izquierda - Botones (visible en desktop) -->
      <div class="columna-izquierda admin-izquierda" id="adminIzquierda">
        <div class="admin-botones">
          <button class="admin-btn" data-panel="pescadores">
            🎣 Pescadores
          </button>
          <button class="admin-btn" data-panel="clubs">🏢 Clubs</button>
          <button class="admin-btn" data-panel="administradores">
            👤 Administradores
          </button>
          <button class="admin-btn" data-panel="jornadas">📅 Jornadas</button>
          <button class="admin-btn" data-panel="concursos">🏆 Concursos</button>
          <button class="admin-btn" data-panel="especies">🐟 Especies</button>
        </div>
      </div>

      <!-- Columna central - Contenido -->
      <div class="columna-centro admin-centro"></div>
    </div>

    <footer class="footer">
      <p>
        © 2026 - Registro de Jornadas de Pesca Recreativa |
        <a href="aviso-legal.html">Aviso legal</a> |
        <a href="politica-privacidad.html">Política de privacidad</a> |
        <a href="politica-de-cookies.html">Política de cookies</a> |
        <a href="condiciones-de-uso.html">Condiciones de uso</a>
        <a href="basilicontech@gmail.com">Contacto: alfonsoisman@gmail.com</a>
      </p>
      <p>Sistema de Información Geográfica para pescadores recreativos</p>
    </footer>

    <script src="administrador.js"></script>
  </body>
</html>
